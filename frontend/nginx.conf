# Cloudflare's tunnel reaches nginx through the Docker gateway; only from there is the visitor
# address in CF-Connecting-IP believed. A client connecting directly keeps its own address, so a
# forged header cannot dodge the per-address sign-in limits.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 127.0.0.1;
real_ip_header CF-Connecting-IP;

# The tunnel speaks plain HTTP to nginx; keep the visitor's https so cookies get the Secure flag.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
}

# Cloudflare marks a visitor's plain-http request; send it to https before anything is typed in.
# Requests without the header (local checks, development) are served as they are.
map $http_x_forwarded_proto $redirect_to_https {
    default 0;
    http    1;
}

server {
    listen 80;
    server_name _;
    # 1 GiB package plus multipart overhead. Align with backend import budgets.
    client_max_body_size 1100m;
    client_body_timeout 300s;

    if ($redirect_to_https) {
        return 301 https://$host$request_uri;
    }

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # A location with its own add_header drops every server-level one, so each location repeats these.
    # /api responses carry the backend's own headers; the CSP lives in index.html.

    # Missing old build assets must not return index.html as JavaScript.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Frontend - React SPA routing; always check for a newer deployment.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header CF-Connecting-IP "";  # the backend uses X-Real-IP only
    }
}
