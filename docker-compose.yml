services:
  backend:
    build: ./backend
    container_name: anki-backend
    restart: unless-stopped
    environment:
      - DATABASE_DIR=/data
      - CORS_ORIGINS=*
      - ANKI_IMPORT_MAX_UPLOAD_BYTES=${ANKI_IMPORT_MAX_UPLOAD_BYTES:-1073741824}
      - ANKI_IMPORT_MAX_UNCOMPRESSED_BYTES=${ANKI_IMPORT_MAX_UNCOMPRESSED_BYTES:-3221225472}
      - ANKI_IMPORT_MAX_MEDIA_BYTES=${ANKI_IMPORT_MAX_MEDIA_BYTES:-2147483648}
      - ANKI_IMPORT_MAX_SINGLE_MEDIA_BYTES=${ANKI_IMPORT_MAX_SINGLE_MEDIA_BYTES:-268435456}
      - ANKI_IMPORT_MAX_CARDS=${ANKI_IMPORT_MAX_CARDS:-100000}
      - ANKI_IMPORT_MAX_NOTES=${ANKI_IMPORT_MAX_NOTES:-100000}
      - ANKI_IMPORT_MAX_MEDIA_FILES=${ANKI_IMPORT_MAX_MEDIA_FILES:-100000}
      - ANKI_IMPORT_MAX_ZIP_ENTRIES=${ANKI_IMPORT_MAX_ZIP_ENTRIES:-100010}
      - ANKI_IMPORT_MIN_FREE_BYTES=${ANKI_IMPORT_MIN_FREE_BYTES:-268435456}
      - APP_ENV=production
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in .env or environment}
    volumes:
      - anki-data:/data
      - anki-media:/app/media
    networks:
      - anki-network

  frontend:
    build:
      context: ./frontend
      args:
        VITE_PACKAGE_API_URL: ${VITE_PACKAGE_API_URL:-}
    container_name: anki-frontend
    restart: unless-stopped
    ports:
      - "3456:80"
    depends_on:
      - backend
    networks:
      - anki-network

volumes:
  anki-data:
    driver: local
  anki-media:
    driver: local

networks:
  anki-network:
    driver: bridge
