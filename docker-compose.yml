services:
  backend:
    build: ./backend
    container_name: anki-backend
    restart: unless-stopped
    environment:
      - DATABASE_DIR=/data
      - CORS_ORIGINS=*
      - ANKI_IMPORT_MAX_UPLOAD_BYTES=${ANKI_IMPORT_MAX_UPLOAD_BYTES:-1073741824}
      - ANKI_IMPORT_MAX_UNCOMPRESSED_BYTES=${ANKI_IMPORT_MAX_UNCOMPRESSED_BYTES:-3221225472}
      - ANKI_IMPORT_MAX_MEDIA_BYTES=${ANKI_IMPORT_MAX_MEDIA_BYTES:-2147483648}
      - ANKI_IMPORT_MAX_SINGLE_MEDIA_BYTES=${ANKI_IMPORT_MAX_SINGLE_MEDIA_BYTES:-268435456}
      - ANKI_IMPORT_MAX_CARDS=${ANKI_IMPORT_MAX_CARDS:-100000}
      - ANKI_IMPORT_MAX_NOTES=${ANKI_IMPORT_MAX_NOTES:-100000}
      - ANKI_IMPORT_MAX_MEDIA_FILES=${ANKI_IMPORT_MAX_MEDIA_FILES:-100000}
      - ANKI_IMPORT_MAX_ZIP_ENTRIES=${ANKI_IMPORT_MAX_ZIP_ENTRIES:-100010}
      - ANKI_IMPORT_MIN_FREE_BYTES=${ANKI_IMPORT_MIN_FREE_BYTES:-268435456}
      - APP_ENV=production
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in .env or environment}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:3456}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      # Pronunciation audio for vocabulary (optional; leave unset to disable)
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # Each model has its own free daily quota (10 requests); the job moves to the next when one runs out.
      - GEMINI_TTS_MODELS=${GEMINI_TTS_MODELS:-gemini-3.8-flash-lite-tts,gemini-3.8-flash-tts}
      - GEMINI_TTS_VOICE=${GEMINI_TTS_VOICE:-Kore}
      - GEMINI_TTS_BATCH=${GEMINI_TTS_BATCH:-40}
      # Free tier allows 3 requests per minute per model.
      - GEMINI_TTS_RPM=${GEMINI_TTS_RPM:-3}
      - GEMINI_VERIFY_MODEL=${GEMINI_VERIFY_MODEL:-gemini-3.5-flash-lite}
      # When Gemini's free quota runs out, voice the remaining words offline with Piper (set 0 to wait instead).
      - TTS_PIPER_FALLBACK=${TTS_PIPER_FALLBACK:-1}
    volumes:
      - anki-data:/data
      - anki-media:/app/media
    networks:
      - anki-network

  frontend:
    build:
      context: ./frontend
      args:
        VITE_PACKAGE_API_URL: ${VITE_PACKAGE_API_URL:-}
    container_name: anki-frontend
    restart: unless-stopped
    ports:
      - "3456:80"
    depends_on:
      - backend
    networks:
      - anki-network

volumes:
  anki-data:
    driver: local
  anki-media:
    driver: local

networks:
  anki-network:
    driver: bridge
