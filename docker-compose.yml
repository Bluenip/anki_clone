services:
  backend:
    build: ./backend
    container_name: anki-backend
    restart: unless-stopped
    environment:
      - DATABASE_DIR=/data
      # The browser calls /api through nginx on the same origin; extra origins are only for other front ends.
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3456}
      - ANKI_IMPORT_MAX_UPLOAD_BYTES=${ANKI_IMPORT_MAX_UPLOAD_BYTES:-1073741824}
      - ANKI_IMPORT_MAX_UNCOMPRESSED_BYTES=${ANKI_IMPORT_MAX_UNCOMPRESSED_BYTES:-3221225472}
      - ANKI_IMPORT_MAX_MEDIA_BYTES=${ANKI_IMPORT_MAX_MEDIA_BYTES:-2147483648}
      - ANKI_IMPORT_MAX_SINGLE_MEDIA_BYTES=${ANKI_IMPORT_MAX_SINGLE_MEDIA_BYTES:-268435456}
      - ANKI_IMPORT_MAX_CARDS=${ANKI_IMPORT_MAX_CARDS:-100000}
      - ANKI_IMPORT_MAX_NOTES=${ANKI_IMPORT_MAX_NOTES:-100000}
      - ANKI_IMPORT_MAX_MEDIA_FILES=${ANKI_IMPORT_MAX_MEDIA_FILES:-100000}
      - ANKI_IMPORT_MAX_ZIP_ENTRIES=${ANKI_IMPORT_MAX_ZIP_ENTRIES:-100010}
      - ANKI_IMPORT_MIN_FREE_BYTES=${ANKI_IMPORT_MIN_FREE_BYTES:-268435456}
      - APP_ENV=production
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in .env or environment}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:3456}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      # Pronunciation audio for vocabulary comes from the Kokoro service below (unset TTS_URL to disable).
      - TTS_URL=${TTS_URL:-http://tts:8880}
      - KOKORO_VOICE=${KOKORO_VOICE:-af_heart}
    volumes:
      - anki-data:/data
      - anki-media:/app/media
    depends_on:
      - tts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - anki-network

  # Kokoro text-to-speech (hexgrad/kokoro) on the NVIDIA GPU. Needs nvidia-container-toolkit on the host.
  tts:
    build:
      context: ./tts
      # The image works offline, so the chosen voice has to be downloaded at build time.
      args:
        - KOKORO_VOICE=${KOKORO_VOICE:-af_heart}
    container_name: anki-tts
    restart: unless-stopped
    environment:
      - KOKORO_VOICE=${KOKORO_VOICE:-af_heart}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - anki-network

  frontend:
    build:
      context: ./frontend
      args:
        VITE_PACKAGE_API_URL: ${VITE_PACKAGE_API_URL:-}
    container_name: anki-frontend
    restart: unless-stopped
    ports:
      - "3456:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - anki-network

volumes:
  anki-data:
    driver: local
  anki-media:
    driver: local

networks:
  anki-network:
    driver: bridge
